<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>ログイン | Keepia</title>
	<link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>
<main class="auth-container">
	<section class="auth-panel" aria-labelledby="login-title">
		<h1 id="login-title">Keepia ログイン</h1>
		<!-- URLのクエリパラメータに応じてメッセージを表示 -->
		<p class="message error" th:if="${param.error}">
			メールアドレスまたはパスワードを確認してください。
		</p>
		<p class="message success" th:if="${param.logout}">
			ログアウトしました。
		</p>
		<p class="message info" th:if="${param.expired}">
			セッションが終了しました。もう一度ログインしてください。
		</p>
		
		<!-- ログイン情報はSpring Securityの認証フィルターへ送信 -->
		<form th:action="@{/login}" method="post">
			<!-- CSRF対策としてSpring Securityが発行したトークンを送信 -->
			<input type="hidden"
				th:name="${_csrf.parameterName}"
				th:value="${_csrf.token}">
			<div class="field">
				<label for="email">メールアドレス</label>
				<input id="email"
					name="email"
					type="email"
					maxlength="254"
					autocomplete="username"
					required
					autofocus> 
			</div>
			<div class="field">
				<label for="password">パスワード</label>
				<input id="password"
						name="password"
						type="password"
						maxlength="200"
						autocomplete="current-password"
						required>
			</div>
			<button type="submit">ログイン</button>
		</form>
	</section>
</main>
</body>

</html>
