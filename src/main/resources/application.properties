spring.application.name=keepia

# データベースの接続設定
spring.datasource.url=jdbc:postgresql://localhost:5432/keepia
spring.datasource.username=postgres
spring.datasource.password=${KEEPIA_DB_PASSWORD}
##spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.validate-migration-naming=true

# Servletセッション
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# keepia認証設定
keepia.security.absolute-session-timeout=12h
keepia.security.login-failure-window=${KEEPIA_LOGIN_FAILURE_WINDOW:15m}
keepia.security.login-max-failures=${KEEPIA_LOGIN_MAX_FAILURES:5}
keepia.security.login-block-duration=${KEEPIA_LOGIN_BLOCK_DURATION:30m}
keepia.security.login-key-secret=${KEEPIA_LOGIN_KEY_SECRET}
