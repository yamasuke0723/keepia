spring.datasource.url=${KEEPIA_TEST_DB_URL:jdbc:postgresql://localhost:5432/keepia_test}
spring.datasource.username=${KEEPIA_TEST_DB_USER:postgres}
spring.datasource.password=${KEEPIA_TEST_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.validate-migration-naming=true

keepia.security.absolute-session-timeout=12h
keepia.security.login-failure-window=15m
keepia.security.login-max-failures=5
keepia.security.login-block-duration=30m
keepia.security.login-key-secret=test-only-secret-value-with-at-least-32-characters